<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #05070d;
    font-family: ui-sans-serif, system-ui, sans-serif; color: #e7edf6;
    position: relative; overflow: hidden;
  }
  .star { position: absolute; background: #cfe4ef; }
  .wrap { position: absolute; inset: 0; padding: 84px 88px; display: flex; flex-direction: column; justify-content: center; }
  .label {
    font-family: ui-monospace, monospace; font-size: 17px; letter-spacing: .2em;
    text-transform: uppercase; color: #5e6b80; display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 8px; height: 8px; background: #67e0f4; display: inline-block; }
  h1 { margin-top: 30px; font-size: 84px; letter-spacing: -0.035em; }
  .role { margin-top: 18px; font-size: 36px; letter-spacing: -0.01em; color: #67e0f4; }
  .line { margin-top: 44px; font-family: ui-monospace, monospace; font-size: 21px; color: #93a1b5; }
  .line b { color: #e7edf6; font-weight: 400; }
</style>
</head>
<body>
  <div class="star" style="left:6%;top:12%;width:3px;height:3px;opacity:.5"></div>
  <div class="star" style="left:30%;top:84%;width:2px;height:2px;opacity:.35"></div>
  <div class="star" style="left:64%;top:8%;width:2px;height:2px;opacity:.4"></div>
  <div class="star" style="left:90%;top:30%;width:3px;height:3px;opacity:.5"></div>
  <div class="star" style="left:78%;top:74%;width:2px;height:2px;opacity:.35"></div>
  <div class="star" style="left:45%;top:20%;width:2px;height:2px;opacity:.3"></div>
  <div class="star" style="left:16%;top:55%;width:2px;height:2px;opacity:.3"></div>
  <div class="wrap">
    <span class="label"><span class="dot"></span>Open to roles and contract work</span>
    <h1>Meelis Mikiver</h1>
    <div class="role">Full-Stack AI Engineer &amp; SEO Specialist</div>
    <div class="line"><b>~4,000</b> Google clicks a day · <b>14,668</b> GitHub contributions last year</div>
  </div>
</body>
</html>
